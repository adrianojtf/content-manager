<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="" />
    <meta name="theme-color" content="#172b4d" />
    <title data-i18n="app.documentTitle"></title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-i18n-aria-label="app.navigationLabel">
        <a class="brand" href="/" aria-label="CreatorDesk">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span class="brand-copy">CreatorDesk<small data-i18n="app.brandSubtitle"></small></span>
        </a>
        <div class="workspace">
          <span class="avatar" aria-hidden="true">CD</span>
          <span><strong data-i18n="app.workspace"></strong><small data-i18n="app.localPilot"></small></span>
        </div>
        <div class="nav-group">
          <p class="nav-label" data-i18n="nav.workspace"></p>
          <nav class="nav-list">
            <a href="#" aria-disabled="true"><span aria-hidden="true">▦</span><span data-i18n="nav.overview"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">▣</span><span data-i18n="nav.content"></span></a>
            <a class="active" href="#comments" aria-current="page"><span aria-hidden="true">☷</span><span data-i18n="nav.comments"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">◷</span><span data-i18n="nav.schedule"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">◈</span><span data-i18n="nav.analytics"></span></a>
          </nav>
        </div>
        <div class="sidebar-foot">
          <span class="connection-indicator"></span>
          <span data-i18n="app.manualOnly"></span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb"><span data-i18n="app.breadcrumb"></span> <span>/</span> <strong data-i18n="app.pageTitle"></strong></div>
          <div class="top-actions">
            <span class="plan-badge" data-i18n="app.pilotBadge"></span>
            <span class="top-avatar" aria-label="CreatorDesk">CD</span>
          </div>
        </header>

        <div class="page-content">
          <section class="page-heading">
            <div>
              <p class="eyebrow" data-i18n="app.eyebrow"></p>
              <h1 data-i18n="app.pageTitle"></h1>
              <p class="subtitle" data-i18n="app.subtitle"></p>
            </div>
            <button class="button" type="button" disabled data-i18n-title="app.globalSyncUnavailable">
              <span aria-hidden="true">↻</span> <span data-i18n="app.globalSync"></span> <span class="unavailable" data-i18n="app.unavailable"></span>
            </button>
          </section>

          <section class="stats-grid" id="stats" aria-label="Resumo da rede selecionada"></section>

          <section class="panel" id="comments">
            <div class="social-tabs" id="socialTabs" role="tablist" data-i18n-aria-label="app.networksLabel"></div>
            <div class="toolbar">
              <div class="toolbar-copy">
                <h2 id="networkTitle"></h2>
                <p id="networkSubtitle" aria-live="polite"></p>
              </div>
              <div class="toolbar-controls">
                <label class="visually-hidden" for="accountFilter" data-i18n="toolbar.account"></label>
                <select id="accountFilter" class="select-control" aria-label="Conta social"></select>
                <label class="search-control">
                  <span aria-hidden="true">⌕</span>
                  <input id="searchInput" type="search" data-i18n-placeholder="toolbar.search" data-i18n-aria-label="toolbar.searchLabel" autocomplete="off" />
                </label>
                <label class="visually-hidden" for="statusFilter" data-i18n="toolbar.statusFilter"></label>
                <select id="statusFilter" class="select-control">
                  <option value="all" data-i18n="filter.all"></option>
                  <option value="pending" data-i18n="filter.pending"></option>
                  <option value="replied" data-i18n="filter.replied"></option>
                  <option value="unevaluated" data-i18n="filter.unevaluated"></option>
                </select>
                <button class="button" id="toneSettingsToggle" type="button" aria-expanded="false" aria-controls="toneSettings" data-i18n="toolbar.tone"></button>
                <button class="button primary" id="syncNetwork" type="button"><span aria-hidden="true">↻</span><span data-i18n="toolbar.syncNetwork"></span></button>
              </div>
            </div>

            <section class="tone-panel" id="toneSettings" hidden aria-labelledby="toneHeading">
              <div class="tone-heading">
                <h3 id="toneHeading" data-i18n="tone.heading"></h3>
                <p data-i18n="tone.description"></p>
              </div>
              <div class="tone-fields">
                <label class="field">
                  <span data-i18n="tone.primary"></span>
                  <select id="tonePrimary">
                    <option value="FRIENDLY" data-i18n="tone.friendly"></option>
                    <option value="PROFESSIONAL" data-i18n="tone.professional"></option>
                    <option value="CASUAL" data-i18n="tone.casual"></option>
                    <option value="EMPATHETIC" data-i18n="tone.empathic"></option>
                  </select>
                </label>
                <fieldset class="field modifier-field">
                  <legend><span data-i18n="tone.modifiers"></span> <small data-i18n="tone.maximumTwo"></small></legend>
                  <div class="modifier-options">
                    <label><input type="checkbox" data-tone-modifier="CONCISE" /><span data-i18n="tone.concise"></span></label>
                    <label><input type="checkbox" data-tone-modifier="WARM" /><span data-i18n="tone.warm"></span></label>
                    <label><input type="checkbox" data-tone-modifier="ENTHUSIASTIC" /><span data-i18n="tone.enthusiastic"></span></label>
                  </div>
                </fieldset>
                <label class="field note-field">
                  <span><span data-i18n="tone.note"></span> <small id="toneNoteCount">0/500</small></span>
                  <textarea id="toneNote" maxlength="500" rows="2" data-i18n-placeholder="tone.notePlaceholder"></textarea>
                </label>
                <div class="tone-save">
                  <button class="button primary" id="saveToneProfile" type="button" data-i18n="tone.save"></button>
                  <p id="toneProfileStatus" class="tone-status" aria-live="polite" data-i18n="tone.defaultStatus"></p>
                </div>
              </div>
            </section>

            <div class="content-list" id="contentList" aria-live="polite">
              <div class="loading-state"><span class="spinner"></span><span data-i18n="publication.loading"></span></div>
            </div>
          </section>
          <p class="footer-note" data-i18n="app.footer"></p>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
