<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base-url" content="" />
    <meta name="theme-color" content="#172b4d" />
    <title data-i18n="app.documentTitle"></title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" data-i18n-aria-label="app.navigationLabel">
        <a class="brand" href="/" aria-label="CreatorDesk">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span class="brand-copy">CreatorDesk<small data-i18n="app.brandSubtitle"></small></span>
        </a>
        <div class="workspace">
          <span class="avatar" aria-hidden="true">CD</span>
          <span><strong data-i18n="app.workspace"></strong><small data-i18n="app.localPilot"></small></span>
        </div>
        <div class="nav-group">
          <p class="nav-label" data-i18n="nav.workspace"></p>
          <nav class="nav-list">
            <a class="active" href="#dashboard" data-view="dashboard" aria-current="page"><span aria-hidden="true">▦</span><span data-i18n="nav.overview"></span></a>
            <a href="#episodes" data-view="episodes"><span aria-hidden="true">▤</span><span data-i18n="episodes.title"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">▣</span><span data-i18n="nav.content"></span></a>
            <a href="#comments" data-view="comments"><span aria-hidden="true">☷</span><span data-i18n="nav.comments"></span></a>
            <a href="#replies-report" data-view="replies-report"><span aria-hidden="true">↗</span><span data-i18n="nav.repliesReport"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">◷</span><span data-i18n="nav.schedule"></span></a>
            <a href="#" aria-disabled="true"><span aria-hidden="true">◈</span><span data-i18n="nav.analytics"></span></a>
          </nav>
        </div>
        <div class="nav-group">
          <p class="nav-label" data-i18n="nav.preferences"></p>
          <nav class="nav-list">
            <a href="#connections" id="connectionsNav" data-view="connections"><span aria-hidden="true">◎</span><span data-i18n="nav.connectedNetworks"></span></a>
          </nav>
        </div>
        <div class="sidebar-foot">
          <span class="connection-indicator"></span>
          <span data-i18n="app.manualOnly"></span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumb"><span data-i18n="app.breadcrumb"></span> <span>/</span> <strong id="breadcrumbCurrent" data-i18n="app.pageTitle"></strong></div>
          <div class="top-actions">
            <a class="button small mobile-dashboard-link" href="#dashboard" data-view="dashboard"><span aria-hidden="true">▦</span><span data-i18n="nav.overview"></span></a>
            <a class="button small mobile-episodes-link" href="#episodes" data-view="episodes"><span aria-hidden="true">▤</span><span data-i18n="episodes.title"></span></a>
            <a class="button small mobile-comments-link" href="#comments" data-view="comments"><span aria-hidden="true">☷</span><span data-i18n="nav.comments"></span></a>
            <a class="button small mobile-report-link" href="#replies-report" data-view="replies-report"><span aria-hidden="true">↗</span><span data-i18n="nav.repliesReport"></span></a>
            <a class="button small mobile-settings-link" href="#connections" data-view="connections"><span aria-hidden="true">◎</span><span data-i18n="nav.connectedNetworks"></span></a>
            <div class="global-font-settings">
              <button class="button small global-font-settings-toggle" id="globalFontSettingsToggle" type="button" data-action="toggle-global-font-settings" aria-controls="globalFontSettingsPanel" aria-expanded="false" data-i18n-aria-label="settings.fontSettingsAria">
                <span aria-hidden="true">Aa</span><span class="global-font-settings-label" data-i18n="settings.fontSettings"></span>
              </button>
              <div class="global-font-settings-panel" id="globalFontSettingsPanel" role="group" aria-labelledby="globalFontSettingsLabel" hidden>
                <label class="global-font-size-field" for="uiFontSizeSelect">
                  <span id="globalFontSettingsLabel" data-i18n="settings.fontSize"></span>
                  <select id="uiFontSizeSelect" data-ui-font-size-option data-i18n-aria-label="settings.fontSize">
                    <option value="small" data-i18n="settings.fontSize.small"></option>
                    <option value="default" selected data-i18n="settings.fontSize.default"></option>
                    <option value="large" data-i18n="settings.fontSize.large"></option>
                    <option value="very-large" data-i18n="settings.fontSize.veryLarge"></option>
                  </select>
                </label>
              </div>
            </div>
            <span class="plan-badge" data-i18n="app.pilotBadge"></span>
            <span class="top-avatar" aria-label="CreatorDesk">CD</span>
          </div>
        </header>

        <div class="page-content">
          <section id="dashboardScreen" class="dashboard-screen" hidden data-i18n-aria-label="nav.overview" aria-live="polite"></section>
          <section id="episodesScreen" class="episodes-screen" hidden data-i18n-aria-label="episodes.title" aria-live="polite"></section>
          <section id="commentsScreen">
          <section class="page-heading">
            <div>
              <p class="eyebrow" data-i18n="app.eyebrow"></p>
              <h1 data-i18n="app.pageTitle"></h1>
              <p class="subtitle" data-i18n="app.subtitle"></p>
            </div>
            <button class="button" type="button" disabled data-i18n-title="app.globalSyncUnavailable">
              <span aria-hidden="true">↻</span> <span data-i18n="app.globalSync"></span> <span class="unavailable" data-i18n="app.unavailable"></span>
            </button>
          </section>

          <section class="stats-grid" id="stats" data-i18n-aria-label="stats.label"></section>

          <section class="panel" id="comments">
            <div class="social-tabs" id="socialTabs" role="tablist" data-i18n-aria-label="app.networksLabel"></div>
            <div class="toolbar">
              <div class="toolbar-copy">
                <h2 id="networkTitle"></h2>
                <p id="networkSubtitle" aria-live="polite"></p>
              </div>
              <div class="toolbar-controls">
                <label class="visually-hidden" for="accountFilter" data-i18n="toolbar.account"></label>
                <select id="accountFilter" class="select-control" data-i18n-aria-label="toolbar.account"></select>
                <label class="page-size-control">
                  <span data-i18n="toolbar.pageSize"></span>
                  <select id="publicationPageSize" class="select-control" data-i18n-aria-label="toolbar.pageSize">
                    <option value="5" selected>5</option>
                    <option value="10">10</option>
                    <option value="25">25</option>
                  </select>
                </label>
                <label class="search-control">
                  <span aria-hidden="true">⌕</span>
                  <input id="searchInput" type="search" data-i18n-placeholder="toolbar.search" data-i18n-aria-label="toolbar.searchLabel" autocomplete="off" />
                </label>
                <label class="visually-hidden" for="statusFilter" data-i18n="toolbar.statusFilter"></label>
                <select id="statusFilter" class="select-control">
                  <option value="all" data-i18n="filter.all"></option>
                  <option value="pending" data-i18n="filter.pending"></option>
                  <option value="replied" data-i18n="filter.replied"></option>
                  <option value="unevaluated" data-i18n="filter.unevaluated"></option>
                </select>
                <button class="button" id="toneSettingsToggle" type="button" aria-expanded="false" aria-controls="toneSettings" data-i18n="toolbar.tone"></button>
                <button class="button toolbar-icon-button" id="verifiedReleaseScheduleToggle" type="button" aria-expanded="false" aria-controls="verifiedReleaseSchedulePanel" data-i18n-aria-label="toolbar.verifiedSchedule" data-i18n-title="toolbar.verifiedSchedule">
                  <svg class="toolbar-action-icon toolbar-calendar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path>
                  </svg>
                </button>
                <button class="button primary toolbar-icon-button" id="syncPageButton" type="button" aria-labelledby="syncPageLabel" data-i18n-title="toolbar.syncPage">
                  <svg class="toolbar-action-icon" id="syncPageIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20 7v5h-5M4 17v-5h5"></path>
                    <path d="M5.6 9A7 7 0 0 1 17 6l3 3M4 15l3 3a7 7 0 0 0 11.4-3"></path>
                  </svg>
                  <span id="syncPageSpinner" class="spinner" aria-hidden="true" hidden></span>
                  <span id="syncPageLabel" class="visually-hidden" data-i18n="toolbar.syncPage"></span>
                </button>
                <div id="publicationLoadingStatus" class="toolbar-status" role="status" aria-live="polite" hidden></div>
                <div id="syncPageStatus" class="toolbar-status" role="status" aria-live="polite" hidden></div>
              </div>
            </div>

            <section class="tone-panel" id="toneSettings" hidden aria-labelledby="toneHeading">
              <div class="settings-scope" role="group" data-i18n-aria-label="tone.scopeLabel">
                <button class="scope-option is-active" type="button" data-tone-scope="account" aria-pressed="true" data-i18n="tone.scopeAccount"></button>
                <button class="scope-option" type="button" data-tone-scope="global" aria-pressed="false" data-i18n="tone.scopeGlobal"></button>
              </div>
              <div class="tone-heading">
                <h3 id="toneHeading" data-i18n="tone.heading"></h3>
                <p id="toneDescription" data-i18n="tone.description"></p>
              </div>
              <div class="tone-fields">
                <label class="field">
                  <span data-i18n="tone.primary"></span>
                  <select id="tonePrimary">
                    <option value="FRIENDLY" data-i18n="tone.friendly"></option>
                    <option value="PROFESSIONAL" data-i18n="tone.professional"></option>
                    <option value="CASUAL" data-i18n="tone.casual"></option>
                    <option value="EMPATHETIC" data-i18n="tone.empathic"></option>
                  </select>
                </label>
                <fieldset class="field modifier-field">
                  <legend><span data-i18n="tone.modifiers"></span> <small data-i18n="tone.maximumTwo"></small></legend>
                  <div class="modifier-options">
                    <label><input type="checkbox" data-tone-modifier="CONCISE" /><span data-i18n="tone.concise"></span></label>
                    <label><input type="checkbox" data-tone-modifier="WARM" /><span data-i18n="tone.warm"></span></label>
                    <label><input type="checkbox" data-tone-modifier="ENTHUSIASTIC" /><span data-i18n="tone.enthusiastic"></span></label>
                  </div>
                </fieldset>
                <label class="field note-field">
                  <span><span data-i18n="tone.note"></span> <small id="toneNoteCount">0/500</small></span>
                  <textarea id="toneNote" maxlength="500" rows="2" data-i18n-placeholder="tone.notePlaceholder"></textarea>
                </label>
                <div class="tone-save">
                  <button class="button primary" id="saveToneProfile" type="button" data-i18n="tone.save"></button>
                  <p id="toneProfileStatus" class="tone-status" aria-live="polite" data-i18n="tone.defaultStatus"></p>
                </div>
              </div>
            </section>

            <section class="verified-schedule-panel" id="verifiedReleaseSchedulePanel" hidden aria-labelledby="verifiedReleaseScheduleHeading"></section>

            <div class="content-list" id="contentList" aria-live="polite">
              <div class="loading-state"><span class="spinner"></span><span data-i18n="publication.loading"></span></div>
            </div>
          </section>
          <div id="bulkReplyDialog" hidden></div>
          <p class="footer-note" data-i18n="app.footer"></p>
          </section>
          <section id="connectionsScreen" class="profile-screen" hidden>
            <div class="profile-heading">
              <div>
                <p class="eyebrow" data-i18n="settings.eyebrow"></p>
                <h1 data-i18n="settings.title"></h1>
                <p class="subtitle" data-i18n="settings.subtitle"></p>
              </div>
              <button class="button" type="button" data-action="back-to-comments" data-i18n="settings.backToComments"></button>
            </div>
            <div id="appearanceSettings" class="appearance-settings"></div>
            <section class="profile-ai-section" aria-labelledby="aiSettingsHeading">
              <div class="profile-section-heading">
                <div><h2 id="aiSettingsHeading" data-i18n="settings.aiHeading"></h2><p data-i18n="settings.aiSubtitle"></p></div>
              </div>
              <div id="aiProviderSettings" class="settings-content" aria-live="polite"></div>
            </section>
            <div class="profile-section-heading">
              <h2 data-i18n="settings.heading"></h2>
              <span id="connectedAccountCount" class="profile-count"></span>
            </div>
            <div id="connectedAccounts" class="settings-content" aria-live="polite"></div>
          </section>
          <section id="repliesReportScreen" class="replies-report-screen" hidden aria-labelledby="repliesReportHeading">
            <header class="page-heading">
              <div>
                <p class="eyebrow" data-i18n="report.eyebrow"></p>
                <h1 id="repliesReportHeading" data-i18n="report.title"></h1>
                <p class="subtitle" data-i18n="report.subtitle"></p>
              </div>
              <button id="repliesReportCsv" class="button primary report-export" type="button" data-i18n="report.exportCsv"></button>
            </header>
            <section class="panel report-panel" data-i18n-aria-label="nav.repliesReport">
              <form id="repliesReportFilters" class="report-filters">
                <label class="field" for="repliesReportFrom">
                  <span data-i18n="report.from"></span>
                  <input id="repliesReportFrom" name="from" type="date" required />
                </label>
                <label class="field" for="repliesReportTo">
                  <span data-i18n="report.to"></span>
                  <input id="repliesReportTo" name="to" type="date" required />
                </label>
                <label class="field" for="repliesReportPlatform">
                  <span data-i18n="report.platform"></span>
                  <select id="repliesReportPlatform" name="platform">
                    <option value="" data-i18n="report.allPlatforms"></option>
                    <option value="instagram" data-i18n="network.instagram"></option>
                    <option value="facebook" data-i18n="network.facebook"></option>
                    <option value="tiktok" data-i18n="network.tiktok"></option>
                    <option value="youtube" data-i18n="network.youtube"></option>
                  </select>
                </label>
                <label class="field" for="repliesReportAccount">
                  <span data-i18n="report.account"></span>
                  <select id="repliesReportAccount" name="accountId">
                    <option value="" data-i18n="report.allAccounts"></option>
                  </select>
                </label>
                <label class="field report-search-field" for="repliesReportSearch">
                  <span data-i18n="report.searchLabel"></span>
                  <input id="repliesReportSearch" name="search" type="search" maxlength="200" data-i18n-placeholder="report.search" />
                </label>
                <button class="button primary report-filter-submit" type="submit" data-i18n="report.applyFilters"></button>
              </form>
              <div id="repliesReportResults" class="replies-report-results" aria-live="polite" aria-busy="false"></div>
            </section>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
